<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hplay Market</title>
<style>
  :root{
    --bg:#fafbfc; --text:#15181d; --sub:#6b7078; --line:#e2e5e9;
    --accent:#0f4fa8; --mono-bg:#eef1f5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d11; --text:#e8ebf0; --sub:#868c96; --line:#22262d; --accent:#5ea1f0; --mono-bg:#171a20; }
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; line-height:1.4;
  }
  .wrap{ max-width:620px; margin:0 auto; padding:64px 22px 90px; }

  header h1{ font-size:22px; font-weight:700; letter-spacing:-.01em; }
  header p{ color:var(--sub); font-size:14.5px; margin-top:8px; max-width:440px; }

  .urlrow{
    margin:26px 0 40px; padding-top:18px; border-top:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .urlrow code{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:13px; background:var(--mono-bg); padding:5px 9px; border-radius:6px; color:var(--text);
  }
  .urlrow button{
    border:1px solid var(--line); background:none; color:var(--text); font-size:12.5px; font-weight:600;
    padding:5px 12px; border-radius:6px; cursor:pointer;
  }
  .urlrow button:active{ background:var(--mono-bg); }

  .tabs{ display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:4px; }
  .tab{
    background:none; border:none; cursor:pointer; padding:0 0 10px; font-size:13px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; color:var(--sub);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  .row{
    display:flex; align-items:baseline; justify-content:space-between; gap:14px;
    padding:13px 0; border-bottom:1px solid var(--line);
  }
  .row .name{ font-weight:600; font-size:14.5px; }
  .row .desc{ color:var(--sub); font-size:13px; text-align:right; }
  .empty{ color:var(--sub); font-size:13.5px; padding:14px 0; border-bottom:1px solid var(--line); }

  .swatch{ display:flex; gap:3px; }
  .swatch span{ width:14px; height:14px; border-radius:3px; display:block; border:1px solid rgba(0,0,0,.08); }

  footer{ color:var(--sub); font-size:12.5px; margin-top:34px; }
  footer a{ color:var(--accent); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hplay Market</h1>
    <p>Apps and background themes for Hplay's Get More screen. Add something here and it shows up next time the app opens — no reinstall.</p>
  </header>

  <div class="urlrow">
    <code id="siteUrl">…</code>
    <button id="copyBtn" type="button">Copy URL</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="apps">Apps</button>
    <button class="tab" data-tab="themes">Themes</button>
  </div>

  <div class="panel active" id="panel-apps">
    <div id="appsList"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel" id="panel-themes">
    <div id="themesList"><div class="empty">Loading…</div></div>
  </div>

  <footer>Paste the URL above into Hplay → Settings → Customize → Get More → Marketplace URL.
    Source on <a href="https://github.com/iwohost/hplay-market" target="_blank" rel="noopener">GitHub</a>.</footer>
</div>

<script>
"use strict";
const base = location.href.replace(/index\.html?$/,'').replace(/\/+$/,'');
document.getElementById('siteUrl').textContent = base;
document.getElementById('copyBtn').addEventListener('click', ()=>{
  navigator.clipboard?.writeText(base).then(()=>{
    const b = document.getElementById('copyBtn');
    b.textContent = 'Copied'; setTimeout(()=>b.textContent='Copy URL', 1200);
  });
});

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+btn.dataset.tab));
  });
});

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function row(name, desc){
  return `<div class="row"><span class="name">${esc(name)}</span><span class="desc">${esc(desc||'')}</span></div>`;
}

fetch('manifest.json', {cache:'no-store'}).then(r=>r.json()).then(m=>{
  const apps = m.apps||[], themes = m.themes||[];

  document.getElementById('appsList').innerHTML = apps.length
    ? apps.map(a=>row(a.name||a.id, a.desc||'')).join('')
    : '<div class="empty">No apps yet — add one to manifest.json.</div>';

  document.getElementById('themesList').innerHTML = themes.length
    ? themes.map(t=>{
        const sw = (t.b||[]).map(c=>`<span style="background:${esc(c)}"></span>`).join('');
        return `<div class="row"><span class="name">${esc(t.name||t.id)}</span><span class="swatch">${sw}</span></div>`;
      }).join('')
    : '<div class="empty">No themes yet — add one to manifest.json.</div>';
}).catch(()=>{
  ['appsList','themesList'].forEach(id=>{
    document.getElementById(id).innerHTML = '<div class="empty">Couldn’t load manifest.json.</div>';
  });
});
</script>
</body>
</html>
