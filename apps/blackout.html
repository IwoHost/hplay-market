<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blackout</title>
<style>
  :root{ --bg:#0e1016; --text:#e8ebf0; --sub:#8a93a6; --off:#1c2230; --on:#e0d85a; --cursor:#4ac0ff; }
  @media (prefers-color-scheme: light){ :root{ --bg:#f2f3f7; --text:#151a24; --sub:#5c6577; --off:#d4d9e3; --on:#e0c23a; --cursor:#0f7fc4; } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; overflow:hidden; touch-action:none; }
  body{
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:6px;
  }
  .title{ font-size:12px; font-weight:800; letter-spacing:.05em; }
  .grid{ display:grid; gap:3px; }
  .cell{
    width:min(8.6vw,9.4vh,32px); height:min(8.6vw,9.4vh,32px);
    background:var(--off); border-radius:4px;
    outline:2px solid transparent; outline-offset:-2px;
  }
  .cell.on{ background:var(--on); box-shadow:0 0 8px var(--on); }
  .cell.cur{ outline-color:var(--cursor); }
  .status{ font-size:10.5px; font-weight:700; color:var(--sub); text-align:center; min-height:14px; }
  .hint{ font-size:9px; color:var(--sub); text-align:center; max-width:220px; }
</style>
</head>
<body>
  <div class="title">BLACKOUT</div>
  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
  <div class="hint">Wheel moves the cursor, center toggles it and its neighbors — turn every light off</div>

<script>
"use strict";
const SIZE = 5;
const $grid = document.getElementById('grid');
const $status = document.getElementById('status');
$grid.style.gridTemplateColumns = 'repeat('+SIZE+', 1fr)';

let lights = [];
let cellEls = [];
let cursor = 0, moves = 0, best = null, won = false;

for(let i=0;i<SIZE*SIZE;i++){
  const el = document.createElement('div'); el.className = 'cell';
  $grid.appendChild(el);
  cellEls.push(el);
}

let ac = null;
function ensureAudio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function click_(freq){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='square'; o.frequency.value = freq||900;
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.06);
}
function winChime(){
  if(!ac) return;
  const t = ac.currentTime;
  [392,523,659,784].forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.001, t+i*0.08);
    g.gain.exponentialRampToValueAtTime(0.13, t+i*0.08+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.08+0.22);
    o.connect(g).connect(ac.destination);
    o.start(t+i*0.08); o.stop(t+i*0.08+0.24);
  });
}

function idx(r,c){ return r*SIZE+c; }
function toggleAt(r,c){
  if(r<0||c<0||r>=SIZE||c>=SIZE) return;
  lights[idx(r,c)] = !lights[idx(r,c)];
}
function toggleCross(i){
  const r = Math.floor(i/SIZE), c = i%SIZE;
  toggleAt(r,c); toggleAt(r-1,c); toggleAt(r+1,c); toggleAt(r,c-1); toggleAt(r,c+1);
}
function paint(){
  cellEls.forEach((el,i)=>{
    el.classList.toggle('on', !!lights[i]);
    el.classList.toggle('cur', i===cursor && !won);
  });
}
function isAllOff(){ return lights.every(v=>!v); }

function newPuzzle(){
  lights = new Array(SIZE*SIZE).fill(false);
  // generate from an all-off, solvable state by applying random toggles (each toggle is its own inverse)
  const scramble = 14 + Math.floor(Math.random()*6);
  for(let k=0;k<scramble;k++) toggleCross(Math.floor(Math.random()*SIZE*SIZE));
  if(isAllOff()) toggleCross(Math.floor(Math.random()*SIZE*SIZE));
  cursor = 0; moves = 0; won = false;
  paint();
  $status.textContent = 'Moves: 0'+(best===null?'':' · Best: '+best);
}

function move(dir, mult){
  if(won) return;
  cursor = ((cursor + dir*(mult||1)) % (SIZE*SIZE) + SIZE*SIZE) % (SIZE*SIZE);
  paint();
}
function press(){
  ensureAudio();
  if(won){ newPuzzle(); return; }
  toggleCross(cursor);
  moves++;
  click_(1000);
  if(navigator.vibrate) navigator.vibrate(6);
  paint();
  if(isAllOff()){
    won = true;
    best = best===null ? moves : Math.min(best, moves);
    winChime();
    if(navigator.vibrate) navigator.vibrate([10,30,10,30,10]);
    $status.textContent = 'Blackout in '+moves+' moves! Best: '+best+' — press center for a new grid';
    paint();
  } else {
    $status.textContent = 'Moves: '+moves+(best===null?'':' · Best: '+best);
  }
}

window.addEventListener('message', (e)=>{
  if(!e.data || e.data.channel!=='hplay') return;
  if(e.data.type==='wheel') move(e.data.dir, e.data.mult);
  if(e.data.type==='select') press();
});
cellEls.forEach((el,i)=>el.addEventListener('click', ()=>{ ensureAudio(); cursor=i; paint(); press(); }));

newPuzzle();
</script>
</body>
</html>
