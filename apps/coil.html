<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coil</title>
<style>
  :root{ --bg:#0d1016; --text:#e8ebf0; --sub:#8a93a6; --head:#5ac97a; --body:#2e8f57; --food:#e0a05a; }
  @media (prefers-color-scheme: light){ :root{ --bg:#eef1f6; --text:#151a24; --sub:#5c6577; --head:#278a4a; --body:#5cb87e; --food:#c4741f; } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; overflow:hidden; touch-action:none; }
  body{
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center;
  }
  .hud{ display:flex; justify-content:space-between; width:100%; padding:7px 12px; font-size:11px; font-weight:700; color:var(--sub); }
  canvas{ display:block; touch-action:none; }
  .msg{
    position:fixed; left:50%; top:44%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none;
  }
  .msg .big{ font-size:16px; font-weight:800; margin-bottom:4px; }
  .msg .small{ font-size:11px; color:var(--sub); }
</style>
</head>
<body>
  <div class="hud">
    <span id="score">Length: 1</span>
    <span id="best">Best: 0</span>
  </div>
  <canvas id="c"></canvas>
  <div class="msg" id="msg"></div>

<script>
"use strict";
const $c = document.getElementById('c');
const ctx = $c.getContext('2d');
const $score = document.getElementById('score');
const $best = document.getElementById('best');
const $msg = document.getElementById('msg');

let W=0, H=0, cell=16, cols=0, rows=0;
function resize(){
  const DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight - 32;
  cell = Math.max(9, Math.min(18, Math.floor(Math.min(W,H)/20)));
  cols = Math.floor(W/cell); rows = Math.floor(H/cell);
  $c.width = cols*cell*DPR; $c.height = rows*cell*DPR;
  $c.style.width = (cols*cell)+'px'; $c.style.height = (rows*cell)+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

// clockwise cycle in a y-down grid: right -> down -> left -> up -> right
const DIRS = [{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}];
let dirIdx = 0;
let snake, food, score, best = 0, running, over, tickMs;

let ac = null;
function ensureAudio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function blip(freq, dur, peak){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='square'; o.frequency.value=freq;
  g.gain.setValueAtTime(peak||0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.07));
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+(dur||0.07)+0.02);
}

function placeFood(){
  let fx, fy, clash;
  do{
    fx = Math.floor(Math.random()*cols); fy = Math.floor(Math.random()*rows);
    clash = snake.some(s=>s.x===fx && s.y===fy);
  } while(clash);
  food = {x:fx, y:fy};
}
function reset(){
  dirIdx = 0;
  const sx = Math.floor(cols/3), sy = Math.floor(rows/2);
  snake = [{x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy}];
  score = 0; over = false; running = false; tickMs = 130;
  updateHud();
  placeFood();
  showMsg('Coil', 'Turn the wheel to steer, press center to start');
}
function updateHud(){ $score.textContent = 'Length: '+snake.length; $best.textContent = 'Best: '+best; }
function showMsg(big, small){ $msg.innerHTML = '<div class="big">'+big+'</div><div class="small">'+(small||'')+'</div>'; }
function hideMsg(){ $msg.innerHTML=''; }

function turn(dir){
  dirIdx = ((dirIdx + (dir>0?1:3)) % 4 + 4) % 4;
}
function startOrRestart(){
  ensureAudio();
  if(over){ reset(); running = true; hideMsg(); return; }
  if(!running){ running = true; hideMsg(); }
}

let acc = 0, lastTs = null;
function tick(){
  const d = DIRS[dirIdx];
  const head = snake[0];
  const nx = head.x + d.x, ny = head.y + d.y;
  if(nx<0 || ny<0 || nx>=cols || ny>=rows || snake.some(s=>s.x===nx && s.y===ny)){
    over = true; running = false;
    best = Math.max(best, snake.length);
    updateHud();
    blip(140, 0.25, 0.09);
    if(navigator.vibrate) navigator.vibrate([8,40,8]);
    showMsg('You Coiled Up', 'Length '+snake.length+' — press center to retry');
    return;
  }
  snake.unshift({x:nx, y:ny});
  if(nx===food.x && ny===food.y){
    score++; updateHud(); blip(760, 0.08, 0.08);
    tickMs = Math.max(70, tickMs - 2);
    placeFood();
  } else {
    snake.pop();
  }
}

function step(ts){
  const dt = lastTs===null ? 16 : Math.min(50, ts-lastTs);
  lastTs = ts;
  if(running && !over){
    acc += dt;
    while(acc > tickMs){ acc -= tickMs; tick(); if(over) break; }
  }
  draw();
  requestAnimationFrame(step);
}
function draw(){
  ctx.clearRect(0,0,cols*cell,rows*cell);
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--food');
  ctx.fillRect(food.x*cell+1, food.y*cell+1, cell-2, cell-2);
  const bodyColor = getComputedStyle(document.body).getPropertyValue('--body');
  const headColor = getComputedStyle(document.body).getPropertyValue('--head');
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? headColor : bodyColor;
    ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
  });
}

window.addEventListener('message', (e)=>{
  if(!e.data || e.data.channel!=='hplay') return;
  if(e.data.type==='wheel'){ ensureAudio(); turn(e.data.dir); }
  if(e.data.type==='select') startOrRestart();
});

let dragX = null;
$c.addEventListener('pointerdown', e=>{ dragX = e.clientX; startOrRestart(); });
$c.addEventListener('pointermove', e=>{
  if(dragX===null) return;
  const dx = e.clientX - dragX;
  if(Math.abs(dx) > 24){ turn(dx>0?1:-1); dragX = e.clientX; }
});
$c.addEventListener('pointerup', ()=>{ dragX = null; });
$c.addEventListener('pointercancel', ()=>{ dragX = null; });

resize();
reset();
requestAnimationFrame(step);
</script>
</body>
</html>
