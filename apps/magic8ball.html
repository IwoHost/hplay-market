<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magic 8-Ball</title>
<style>
  :root{ --bg:#101318; --text:#e8ebf0; --sub:#9aa4b1; }
  @media (prefers-color-scheme: light){ :root{ --bg:#f4f5f7; --text:#1c1f24; --sub:#5a5e66; } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    touch-action:manipulation; overflow:hidden; padding:6px;
  }
  .ball{
    width:min(44vw, 62vh); max-width:170px; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #3a3f48, #0c0d10 68%);
    box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 0 0 6px #050506;
    display:flex; align-items:center; justify-content:center;
  }
  .ball.shaking{ animation:shake .5s ease; }
  @keyframes shake{
    0%,100%{ transform:rotate(0); }
    20%{ transform:rotate(-8deg); }
    40%{ transform:rotate(7deg); }
    60%{ transform:rotate(-6deg); }
    80%{ transform:rotate(5deg); }
  }
  .window{
    width:58%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2f6fd6, #0d2a63 75%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 14px rgba(0,0,0,.6);
    padding:10%;
  }
  .window .ans{ color:#eaf1ff; font-weight:700; font-size:min(3.4vh, 12px); text-align:center; line-height:1.3; }
  .hint{ color:var(--sub); font-size:11px; font-weight:600; text-align:center; }
</style>
</head>
<body>
  <div class="ball" id="ball">
    <div class="window"><div class="ans" id="ans">?</div></div>
  </div>
  <div class="hint" id="hint">Press center (or tap) to ask</div>

<script>
"use strict";
const ANSWERS = [
  'It is certain', 'Without a doubt', 'Yes definitely', 'You may rely on it',
  'As I see it, yes', 'Most likely', 'Outlook good', 'Signs point to yes',
  'Reply hazy, try again', 'Ask again later', 'Better not tell you now',
  'Cannot predict now', 'Concentrate and ask again', "Don't count on it",
  'My reply is no', 'My sources say no', 'Outlook not so good', 'Very doubtful'
];
const $ball = document.getElementById('ball');
const $ans = document.getElementById('ans');
const $hint = document.getElementById('hint');
let shaking = false;

function shake(){
  if(shaking) return;
  shaking = true;
  $ball.classList.remove('shaking'); void $ball.offsetWidth; $ball.classList.add('shaking');
  $ans.textContent = '…';
  $hint.textContent = 'Shaking…';
  if(navigator.vibrate) navigator.vibrate(15);
  setTimeout(()=>{
    $ans.textContent = ANSWERS[Math.floor(Math.random()*ANSWERS.length)];
    $hint.textContent = 'Press center to ask again';
    shaking = false;
  }, 500);
}
$ball.addEventListener('click', shake);
window.addEventListener('message', (e)=>{
  if(!e.data || e.data.channel!=='hplay') return;
  if(e.data.type==='select') shake();
});
</script>
</body>
</html>
