<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Echo</title>
<style>
  :root{ --bg:#0e1016; --text:#e8ebf0; --sub:#8a93a6; --pad:#232838; }
  @media (prefers-color-scheme: light){ :root{ --bg:#f2f3f7; --text:#151a24; --sub:#5c6577; --pad:#dfe2ea; } }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    overflow:hidden; touch-action:none; padding:6px;
  }
  .status{ font-size:11px; font-weight:700; color:var(--sub); text-align:center; min-height:14px; }
  .ring{
    position:relative; width:min(56vw,64vh); max-width:220px; aspect-ratio:1;
  }
  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:34%; aspect-ratio:1; border-radius:50%;
    background:var(--pad); display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; text-align:center; line-height:1.15; padding:6%;
  }
  .pad{
    position:absolute; width:26%; aspect-ratio:1; border-radius:50%;
    transform:translate(-50%,-50%); opacity:.42; transition:opacity .1s, transform .1s;
  }
  .pad.cursor{ outline:2.5px solid var(--text); outline-offset:2px; }
  .pad.lit{ opacity:1; transform:translate(-50%,-50%) scale(1.14); }
  .hint{ font-size:9.5px; color:var(--sub); text-align:center; max-width:220px; }
</style>
</head>
<body>
  <div class="status" id="status">Press center to start</div>
  <div class="ring" id="ring">
    <div class="hub" id="hub">Echo</div>
  </div>
  <div class="hint">Turn the wheel to move around the ring, press center to repeat the pattern</div>

<script>
"use strict";
const COLORS = ['#e05a5a','#e0a05a','#e0d85a','#5ac97a','#4ac0ff','#a05ae0'];
const FREQS  = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3];
const N = COLORS.length;
const $ring = document.getElementById('ring');
const $hub = document.getElementById('hub');
const $status = document.getElementById('status');

let pads = [];
function buildPads(){
  for(let i=0;i<N;i++){
    const el = document.createElement('div');
    el.className = 'pad';
    const ang = (i/N)*Math.PI*2 - Math.PI/2;
    const cx = 50 + 37*Math.cos(ang), cy = 50 + 37*Math.sin(ang);
    el.style.left = cx+'%'; el.style.top = cy+'%';
    el.style.background = COLORS[i];
    $ring.appendChild(el);
    pads.push(el);
  }
}
buildPads();

let ac = null;
function ensureAudio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(freq, dur){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.14, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.32));
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+(dur||0.32)+0.02);
}
function buzz(){
  if(!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = 90;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t+0.37);
}

let sequence = [], inputPos = 0, cursor = 0;
let state = 'idle';   // idle | showing | input | gameover
let best = 0;
let showTimer = 0;

function lightPad(i, on){ pads[i].classList.toggle('lit', on); }
function paintCursor(){ pads.forEach((p,i)=>p.classList.toggle('cursor', i===cursor && state==='input')); }

function addStep(){ sequence.push(Math.floor(Math.random()*N)); }

function playShow(){
  state = 'showing'; inputPos = 0; paintCursor();
  $status.textContent = 'Watch…';
  let i = 0;
  function stepShow(){
    if(i>0) lightPad(sequence[i-1], false);
    if(i>=sequence.length){
      state = 'input'; paintCursor();
      $status.textContent = 'Your turn — round '+sequence.length;
      return;
    }
    lightPad(sequence[i], true);
    tone(FREQS[sequence[i]]);
    i++;
    showTimer = setTimeout(stepShow, 520);
  }
  clearTimeout(showTimer);
  stepShow();
}

function startGame(){
  sequence = []; cursor = 0;
  addStep();
  $hub.textContent = 'Round 1';
  setTimeout(playShow, 300);
}

function moveCursor(dir, mult){
  if(state!=='input') return;
  cursor = ((cursor + dir*(mult||1)) % N + N) % N;
  paintCursor();
}
function confirm_(){
  ensureAudio();
  if(state==='idle' || state==='gameover'){ startGame(); return; }
  if(state!=='input') return;
  const want = sequence[inputPos];
  if(cursor===want){
    lightPad(cursor, true); tone(FREQS[cursor], 0.18);
    setTimeout(()=>lightPad(cursor,false), 160);
    inputPos++;
    if(inputPos>=sequence.length){
      $hub.textContent = 'Round '+(sequence.length+1);
      if(navigator.vibrate) navigator.vibrate(10);
      setTimeout(()=>{ addStep(); playShow(); }, 550);
    }
  } else {
    state = 'gameover';
    best = Math.max(best, sequence.length-1);
    buzz();
    if(navigator.vibrate) navigator.vibrate([8,40,8]);
    $hub.textContent = 'Echo';
    $status.textContent = 'Missed it — reached '+(sequence.length-1)+' · best '+best+' · press center';
    paintCursor();
  }
}

window.addEventListener('message', (e)=>{
  if(!e.data || e.data.channel!=='hplay') return;
  if(e.data.type==='wheel'){ ensureAudio(); moveCursor(e.data.dir, e.data.mult); }
  if(e.data.type==='select') confirm_();
});
pads.forEach((p,i)=>{
  p.addEventListener('click', ()=>{ ensureAudio(); cursor = i; paintCursor(); confirm_(); });
});
</script>
</body>
</html>
